# Prices of the models you benchmark, to be filled in by you. The benchmark refuses to run a model
# that has no entry here, and it uses these numbers for the cost estimate it asks you to approve
# and for the cost of every run.
#
# `currency` is only a label for the tables. Every entry under `models` is named exactly as the
# model is passed to --models and has two numbers: `input_per_million` and `output_per_million`,
# the price of one million input and output tokens. Copy them from your provider's price list.
currency: USD
models:
  gpt-6-luna:
    input_per_million: 0.10
    output_per_million: 0.50

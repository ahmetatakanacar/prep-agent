[project]
name = "prep-agent"
dynamic = ["version"]
description = "LLM-planned, validated data preparation for tabular ML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmet Atakan Acar" }]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "pydantic>=2",
    "typer",
    "rich",
    "jinja2",
    "joblib",
]

[project.scripts]
prep-agent = "prep_agent.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/prep_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prep_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[project]
name = "prep-agent"
dynamic = ["version"]
description = "LLM-planned, validated data preparation for tabular ML."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmet Atakan Acar" }]
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "scikit-learn",
    "pydantic>=2",
    "typer",
    "rich",
    "jinja2",
    "joblib",
]

[project.scripts]
prep-agent = "prep_agent.cli:app"

[project.optional-dependencies]
openai = [
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "openai>=3.29.0",
    "pytest",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/prep_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prep_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The benchmark scripts import each other as siblings, so tests see them the same way.
pythonpath = ["benchmarks"]
filterwarnings = ["error"]
markers = [
    "llm: calls the real LLM API; skipped unless PREP_AGENT_RUN_LLM_TESTS=1 and an API key is set",
]
